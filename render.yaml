services:
  # 1. EUREKA - desplegado primero, los demás dependen de él
  - type: web
    name: eureka-server
    env: docker
    dockerContext: ./eureka-server
    plan: free

  # 2. API GATEWAY
  - type: web
    name: api-gateway
    env: docker
    dockerContext: ./api-gateway
    plan: free
    envVars:
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/

