services:
  # 1. EUREKA - desplegado primero, los demás dependen de él
  - type: web
    name: eureka-server
    env: docker
    dockerfilePath: ./eureka-server/Dockerfile
    dockerContext: ./eureka-server
    plan: free

  # 2. API GATEWAY
  - type: web
    name: api-gateway
    env: docker
    dockerfilePath: ./api-gateway/Dockerfile
    dockerContext: ./api-gateway
    plan: free
    envVars:
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/

  # 3. MICROSERVICIOS DE NEGOCIO
  - type: web
    name: usuarios-service
    env: docker
    dockerfilePath: ./usuarios-service/Dockerfile
    dockerContext: ./usuarios-service
    plan: free
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://dpg-d97b08urnols73ckjr60-a:5432/tecnosmart?currentSchema=usuarios
      - key: SPRING_DATASOURCE_USERNAME
        value: tecnosmart_user
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: EUREKA_URL
        value: https://eureka-server.onrender.com/eureka/

